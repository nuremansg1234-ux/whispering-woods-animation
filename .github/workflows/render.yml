name: Render Animation
on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:stable
    steps:
      - uses: actions/checkout@v4
      - name: Render Video
        run: manim -ql scene1.py WhisperingWoodsScene1
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: scene1-video
          path: media/videos/**/*.mp4
          
